:root{--bg:#0D0F14;--surface:#1A1C23;--raised:#2C2F38;--line:#2C2F38;--line-strong:#3A3E4A;--ink:#FFFFFF;--muted:#8E929C;--frame:#07080B;
--blue:#5468D4;--blue-l:#8E9CE6;--red:#CF5F52;--warm:#D08A52;--grn:#5FA877;--green:#8E9CE6;--ok:#8E9CE6;--bad:#CF5F52;--paper:#F2F3F6;--card:linear-gradient(160deg,#1A1C23,#272A34);
--f:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;--fh:"MikodacsPCS",Manrope,sans-serif;--fc:Caveat,cursive;--fm:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:500 16px/1.5 var(--f);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.2px);background-size:22px 22px;background-attachment:fixed}
.wrap{max-width:640px;margin:0 auto;padding:4px 20px 40px}.wrap.narrow{max-width:560px}.pad-b{padding-bottom:130px}
.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:rgba(13,15,20,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top a{text-decoration:none;color:var(--ink)}
.logo{display:inline-flex;align-items:center;font:800 21px/1 var(--f);letter-spacing:-.03em}
.tgl{display:none}
.btn-work{font:700 14px/1 var(--f);color:#0A0A0C;background:var(--paper);border:0;border-radius:999px;padding:11px 16px;cursor:pointer}
.num{font-size:1.3em;line-height:.7}
h1{font:400 44px/.86 var(--fh);letter-spacing:-.011em;text-transform:uppercase;margin:6px 0 16px;text-shadow:3px 0 20px rgba(255,255,255,.35)}
.h1-sm{font-size:38px}
h2{font:800 24px/1.15 var(--f);letter-spacing:-.02em;margin:0 0 8px}
h3{font:800 19px/1.25 var(--f);letter-spacing:-.01em;margin:0 0 8px}
p{margin:0 0 10px}
.label{display:inline-block;font:500 11px/1 var(--fm);letter-spacing:.06em;color:var(--muted);background:var(--raised);border-radius:999px;padding:6px 10px;margin:22px 0 10px}
.label:has(+ h1){display:block;background:none;padding:0;font:700 30px/1 var(--fc);letter-spacing:0;color:var(--blue);margin:18px 0 4px}
.lead{font-size:17px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
.legal{font-size:12px;line-height:1.45;color:var(--muted);margin:12px 0 0}
.ok-t{color:var(--ok)}.bad-t{color:var(--bad)}
.err{color:var(--bad);font-size:14px;margin:8px 0 0}.err:empty{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:20px;margin:16px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 20px;border-radius:999px;border:0;background:var(--raised);color:var(--ink);font:700 16px/1.2 var(--f);cursor:pointer;text-align:center}
.btn.primary{background:var(--paper);color:#0A0A0C}
.sticky .btn.primary,.gate .btn.primary{background:var(--blue);color:#fff}
.btn.block{display:flex;width:100%;margin-top:12px}
.btn.sm{min-height:42px;padding:0 14px;font-size:14px}
.field{display:block;margin:12px 0}.field>span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:6px}
input{width:100%;font:500 17px var(--f);color:var(--ink);background:var(--frame);border:1px solid var(--line-strong);border-radius:14px;padding:14px;appearance:none}
input::placeholder{color:#5B5F6A}
input:focus{outline:none;border-color:var(--blue)}
.bad{border-color:var(--bad)!important}
.stepper{display:flex;align-items:center;gap:8px;margin:14px 0 0;font:500 11px/1 var(--fm);color:var(--muted)}
.stepper span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.stepper i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--raised);display:inline-flex;align-items:center;justify-content:center}
.stepper b{flex:1;height:1px;background:var(--line);min-width:8px}
.stepper .cur{color:var(--ink)}.stepper .cur i{background:var(--blue);color:#fff}
.stepper .done{color:var(--ink)}.stepper .done i{background:rgba(84,104,212,.25);color:var(--blue-l)}
.how{list-style:none;padding:0;margin:18px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;counter-reset:h}
.how li{counter-increment:h;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.how li::before{content:counter(h) "/3";font:500 11px var(--fm);color:var(--muted);display:block;margin-bottom:6px}
.how b{display:block;font:800 15px/1.25 var(--f)}.how span{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:4px}
.gate h3{margin-bottom:4px}
.fold{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin:10px 0}
.fold>summary{cursor:pointer;list-style:none;font:800 16px/1.3 var(--f);display:flex;justify-content:space-between;gap:10px}
.fold>summary::after{content:"+";font:500 22px/1 var(--f);color:var(--muted)}.fold[open]>summary::after{content:"−"}
.fold>summary::-webkit-details-marker,.item summary::-webkit-details-marker{display:none}
.fold[open]>summary{margin-bottom:10px}
.note{background:rgba(77,186,110,.12);color:#8FE0A8;border:1px solid rgba(77,186,110,.35);border-radius:14px;padding:12px 14px;font-size:15px;margin:14px 0 4px}
.seg{display:flex;background:var(--frame);border:1px solid var(--line);border-radius:999px;padding:4px;margin:12px 0 10px;position:sticky;top:62px;z-index:5}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:10px 6px;font:700 14px var(--f);color:var(--muted);cursor:pointer}
.seg button.on{background:var(--paper);color:#0A0A0C}
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.item summary{display:flex;gap:12px;align-items:flex-start;font-weight:700;cursor:pointer;list-style:none}
.item summary i{font:500 12px/1.9 var(--fm);font-style:normal;color:var(--blue-l);min-width:24px}

function buildPlan(answers) {
  const ind = answers.industry;
  const v = IND[ind] || IND.other;
  const route = answers.priority === 'explore' ? suggestPriority(ind) : answers.priority;
  const wf = buildWorkflow(route, ind);
  const idx = { 'Продажи': 0, 'Операционка': 1, 'Финансы': 2 };
  const tops = TOP_IDEAS.filter(t => t.area !== wf.area).map(t => ({ ...t, example: v.units[idx[t.area]], check: v.checks[idx[t.area]] }));
  const library = [
    { area: wf.area, title: wf.title, example: wf.unit, flow: wf.why, test: wf.first, check: wf.gate, measure: wf.measure, first: true },
    ...tops, ...extraIdeas(ind)
  ];
  const owner = answers.team === 'solo' ? 'собственник' : wf.owner;
  const start = answers.team === 'solo' ? 'Прогоните один и тот же пример дважды по письменному чек-листу и сравните решения.' : START_BY_ADOPTION[answers.adoption];
  const funding = answers.decision === 'joint' ? 'Принесите исходные цифры и проверенные результаты второму руководителю, который утверждает решение.'
    : ['team', 'employee', 'builder'].includes(answers.decision) ? 'Отнесите результаты тому, кто владеет бюджетом и процессом.'
    : 'Сначала посмотрите на измеренный результат, потом выделяйте деньги на масштаб.';
  return { route, suggested: suggestPriority(ind), workflow: wf, library, owner, start, funding, industryLabel: QUESTIONS.industry.choices[ind] };
}

function tgUser() { return inTG && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null; }
/* id подписчика Chatplace: приходит в ссылке t.me/tropossbot?startapp=<id> (или ?cid=<id>) */
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
function getCid() {
  const cands = [];
  try { cands.push(new URLSearchParams(location.search).get('cid')); } catch (e) {}
  try { cands.push(new URLSearchParams(location.search).get('tgWebAppStartParam')); } catch (e) {}
  if (tg && tg.initDataUnsafe) cands.push(tg.initDataUnsafe.start_param);
  const found = cands.find(c => c && UUID_RE.test(c));
  if (found) { store('tp_cid', found); return found; }
  return store('tp_cid') || '';
}
const CID = getCid();
function labelOf(key) { const q = QUESTIONS[key], v = state.answers[key]; return q && v ? (q.choices[v] || v) : ''; }
function send(event, payload) {
  const url = CONFIG.HOOKS && CONFIG.HOOKS[event]; if (!url) return;
  const u = tgUser() || {};
  const body = new URLSearchParams({ cid: CID, event, tg_user_id: u.id || '', tg_username: u.username || '', ts: new Date().toISOString() });
  Object.entries(payload || {}).forEach(([k, v]) => { if (v != null && typeof v !== 'object') body.set(k, String(v)); });
  try { fetch(url, { method: 'POST', mode: 'no-cors', body, keepalive: true }).catch(() => {}); } catch (e) {}
}
function openLink(url) {
  if (inTG && /^https:\/\/t\.me\//.test(url)) return tg.openTelegramLink(url);
  if (inTG) return tg.openLink(url);
  window.open(url, '_blank');
}
function go(r) { location.hash = '#/' + r; }
function validPhone(p) {
  const d = (p || '').replace(/\D/g, '');
  if (d.length < 10 || d.length > 15) return false;
  return !(/^(\d)\1+$/.test(d) || /0123456789|1234567890|9876543210/.test(d));
}

function stepper(n) {
  const L = ['Гайд', '7 вопросов', 'Ваш план'];
  return `<div class="stepper">${L.map((t, k) => `<span class="${k < n ? 'done' : k === n ? 'cur' : ''}"><i>${k < n ? '✓' : k + 1}</i>${t}</span>`).join('<b></b>')}</div>`;
}
function sticky(label, act) { return `<div class="sticky"><button class="btn primary block" data-act="${act}">${label}</button></div>`; }

/* ---------- Пример-разбор ---------- */
function walkHTML(id) { return `<div class="walk" id="${id}"></div>`; }
function mountWalk(id, w) {
  const el = document.getElementById(id); if (!el) return;
  const find = (node, d) => { const k = w.steps.findIndex(s => node && s.node === node); return k > 0 ? k : d; };
  const excIdx = find(w.exception.node, 1), fixIdx = find(w.afterRepair.node, 2);
  el.innerHTML = `<ol class="tl">${w.steps.map((s, k) => `<li><i>${k + 1}</i><div><b>${esc(s.node)}</b><p class="rec">${esc(s.record)}</p><p class="det">${esc(s.detail)}</p></div></li>`).join('')}</ol>
    <div class="risk bad-box"><p class="rk">Где ИИ может ошибиться · шаг ${excIdx + 1}</p><b>${esc(w.exception.record)}</b><p>${esc(w.exception.detail)}</p></div>
    <div class="risk ok-box"><p class="rk">Как это предотвращаем · шаг ${fixIdx + 1}</p><b>${esc(w.afterRepair.record)}</b><p>${esc(w.afterRepair.detail)}</p></div>`;
}

/* ---------- 1. Лендинг ---------- */
function viewLanding() {
  const c = state.contact;
  const share = inTG && tg.requestContact ? `<button type="button" class="btn sm ghost-btn" data-act="shareContact">Взять номер из Telegram</button>` : '';
  const phone = c.shared ? `<p class="ok-t small">Номер получен из Telegram ✓</p>`
    : `<label class="field"><span>Телефон</span><input id="gatePhone" type="tel" inputmode="tel" maxlength="40" placeholder="+7 900 000-00-00" autocomplete="tel" value="${esc(c.phone || '')}"></label>${share}`;
  return `${header()}<main class="wrap">
    ${stepper(0)}
    <p class="label">Бесплатный гайд</p>
    <h1><span class="num">30</span> способов применить ИИ в&nbsp;бизнесе</h1>
    <p class="lead">Для продаж, операционки и финансов. Что делает ИИ, что проверяет команда и как попробовать на своих данных.</p>
    <div class="card gate" id="gate">
      <h3>Оставьте номер — гайд откроется сразу</h3>
      ${phone}
      <button class="btn primary block" data-act="getGuide">Получить гайд</button>
      <p class="err" id="gateErr"></p>
      <p class="legal">Нажимая кнопку, вы соглашаетесь на обработку персональных данных и на звонок по гайду.</p>
    </div>
    <ol class="how">
      <li><b>Гайд</b><span>30 способов с примерами</span></li>
      <li><b>7 вопросов</b><span>2 минуты, всё кнопками</span></li>
      <li><b>Ваш план</b><span>С чего начать и сколько часов сэкономите</span></li>
    </ol>
    <details class="fold"><summary>Посмотреть пример из гайда</summary>
      <h3>${esc(WALKS.sales.title)}</h3><p class="muted small">${esc(WALKS.sales.intro)}</p>${walkHTML('walk-land')}</details>
  </main>`;
}

/* ---------- 2. Гайд ---------- */
function viewGuide() {
  const a = AREAS.find(x => x.key === state.area); const base = AREAS.indexOf(a) * 10;
  return `${header()}<main class="wrap pad-b">
    ${stepper(0)}
    <h1 class="h1-sm"><span class="num">30</span> способов применить ИИ</h1>
    <div class="seg">${AREAS.map(x => `<button class="${x.key === a.key ? 'on' : ''}" data-area="${x.key}">${esc(x.name)}</button>`).join('')}</div>
    <p class="muted">${esc(a.lead)}</p>
    <details class="fold"><summary>Пример: ${esc(WALKS[a.key].title.toLowerCase())}</summary>
      <p class="muted small">${esc(WALKS[a.key].intro)}</p>${walkHTML('walk-' + a.key)}</details>
    <div class="list">${USE_CASES[a.key].map((c, k) => `
      <details class="item"><summary><i>${String(base + k + 1).padStart(2, '0')}</i><span>${esc(c[0])}</span></summary>
        <dl><dt>Что делает ИИ</dt><dd>${esc(c[1])}</dd><dt>Как проверить у себя</dt><dd>${esc(c[2])}</dd><dt>Что посчитать</dt><dd>${esc(c[3])}</dd></dl>
      </details>`).join('')}</div>
  </main>${sticky('Подобрать проект · 7 вопросов', 'startQuiz')}`;
}

/* ---------- 3. Вопросы по одному ---------- */
const QTEXT = {
  decision: 'Какая у вас роль?', industry: 'Чем занимается бизнес?', annualRevenue: 'Выручка в год?', team: 'Сколько человек в команде?',
  useFor: 'Для кого внедряете ИИ?', priority: 'Где работа чаще всего застревает?', adoption: 'Как команда пользуется ИИ сейчас?'
};
function viewQuiz() {
  const n = state.q, total = QUIZ.length;
  if (n >= total) return viewContact();
  const key = QUIZ[n], q = QUESTIONS[key], val = state.answers[key];
  return `${header()}<main class="wrap narrow">
    ${stepper(1)}
    <div class="qbar"><span style="width:${Math.round(n / total * 100)}%"></span></div>
    <p class="label">Вопрос ${n + 1} из ${total}</p>
    <h2 class="q">${esc(QTEXT[key])}</h2>
    <div class="opts">${Object.entries(q.choices).map(([k, v]) => `<button class="opt ${val === k ? 'prev' : ''}" data-opt="${k}">${esc(v)}</button>`).join('')}</div>
    <button class="back" data-act="${n ? 'qBack' : 'toGuide'}">← ${n ? 'Назад' : 'К гайду'}</button>
  </main>`;
}
function viewContact() {
  const c = state.contact, u = tgUser();
  const share = inTG && tg.requestContact ? `<button type="button" class="btn sm ghost-btn" data-act="shareContact">Взять номер из Telegram</button>` : '';
  return `${header()}<main class="wrap narrow">
    ${stepper(1)}
    <div class="qbar"><span style="width:100%"></span></div>
    <p class="label">Последний шаг</p>
    <h2 class="q">Куда прислать план?</h2>
    <label class="field"><span>Имя</span><input id="cName" maxlength="80" value="${esc(c.name || (u && u.first_name) || '')}"></label>
    ${c.shared ? '<p class="ok-t small">Номер получен из Telegram ✓</p>' : `<label class="field"><span>Телефон</span><input id="cPhone" type="tel" inputmode="tel" maxlength="40" placeholder="+7 900 000-00-00" value="${esc(c.phone || '')}"></label>${share}`}
    <button class="btn primary block" data-act="finish">Показать мой план</button>
    <p class="err" id="cErr"></p>
    <p class="legal">План откроется сразу здесь, а ссылку на него пришлём в Telegram. Нажимая кнопку, вы соглашаетесь на обработку персональных данных и на звонок по плану.</p>
    <button class="back" data-act="qBack">← Назад</button>
  </main>`;
}
function finishQuiz() {
  const plan = buildPlan(state.answers); planState.route = null;
  store('tp_answers', state.answers); store('tp_contact', state.contact);
  send('plan_created', { name: state.contact.name || '', phone: state.contact.phone || '', role: labelOf('decision'), industry: labelOf('industry'), revenue: labelOf('annualRevenue'), team: labelOf('team'), use_for: labelOf('useFor'), priority: labelOf('priority'), adoption: labelOf('adoption'), project: plan.workflow.title });
  go('plan'); window.scrollTo(0, 0);
}

/* ---------- 4. План ---------- */
function calcResult() {
  const c = planState.calc; const ok = ['volume', 'before', 'after'].every(k => c[k] !== '' && isFinite(+c[k]) && +c[k] >= 0) && Number.isInteger(+c.volume);
  if (!ok) return { ok: false, h: 0, text: 'Введите три числа — посчитаем.' };
  const h = +c.volume * (+c.before - +c.after) / 60;
  if (h <= 0) return { ok: true, h, text: 'По этим цифрам время не экономится. Сначала проверьте, станет ли меньше ошибок.' };
  return { ok: true, h, text: `<b>≈ ${fmt(h)} ч в месяц</b> освобождается. Чтобы окупиться за 3 месяца, настройка должна занять не больше ${fmt(h * 3)} ч.` };
}
function currentWF() { const a = state.answers; return buildWorkflow(planState.route || buildPlan(a).route, a.industry); }
function viewPlan() {
  const a = state.answers, base = buildPlan(a), wf = currentWF();
  const owner = a.team === 'solo' ? 'вы сами' : wf.owner;
  const calc = calcResult();
  const name = state.contact.name ? esc(state.contact.name) + ', в' : 'В';
  const prios = Object.entries(QUESTIONS.priority.choices).filter(([k]) => k !== 'explore');
  const lib = base.library.slice(1);
  return `${header()}<main class="wrap pad-b">
    ${stepper(2)}
    <p class="label">Персональный план · ${esc(base.industryLabel)}</p>
    <h1 class="h1-sm">${name}аш первый ИИ-проект</h1>
    <div class="card summary">
      <h2>${esc(wf.title)}</h2>
      <p class="muted">${esc(wf.fit)}</p>
      <dl class="kv"><dt>Отвечает</dt><dd>${esc(owner)}</dd><dt>Срок проверки</dt><dd>1–2 недели</dd><dt>Экономия</dt><dd id="kvHours">${calc.ok && calc.h > 0 ? '≈ ' + fmt(calc.h) + ' ч/мес' : '—'}</dd></dl>
    </div>

    <section class="block"><p class="label">Шаг 1</p><h3>Что сделать первым</h3><p>${esc(wf.first)}</p></section>

    <section class="block"><p class="label">Шаг 2</p><h3>Как это будет работать</h3>
      ${walkHTML('walk-plan')}</section>

    <section class="block"><p class="label">Шаг 3</p><h3>Как проверить за неделю</h3>
      <ol class="steps"><li><b>Сделайте одну работу дважды</b> — как обычно и с ИИ. ${esc(base.start)}</li>
      <li><b>Сравните.</b> ${esc(wf.measure)}</li><li><b>Решите, расширять ли.</b> ${esc(wf.gate)}</li></ol></section>

    <section class="block"><p class="label">Шаг 4</p><h3>Сколько часов сэкономите</h3>
      <div class="grid3">
        <label class="field"><span>Сколько раз в месяц</span><input type="number" inputmode="numeric" min="0" step="1" data-calc="volume" value="${esc(planState.calc.volume)}"></label>
        <label class="field"><span>Минут сейчас</span><input type="number" inputmode="decimal" min="0" data-calc="before" value="${esc(planState.calc.before)}"></label>
        <label class="field"><span>Минут с ИИ</span><input type="number" inputmode="decimal" min="0" data-calc="after" value="${esc(planState.calc.after)}"></label>
      </div><p class="calc-out" aria-live="polite">${calc.text}</p>
      <button class="btn block" data-act="copyBrief">Скопировать план для команды</button><p class="ok-t small" id="briefMsg"></p></section>

    <details class="fold"><summary>Другой первый проект</summary>
      <p class="muted small">Мы предложили: ${esc(QUESTIONS.priority.choices[base.suggested].toLowerCase())}. Можно выбрать другое.</p>
      <div class="opts row">${prios.map(([k, v]) => `<button class="opt sm ${k === (planState.route || base.route) ? 'on' : ''}" data-route="${k}">${esc(v)}</button>`).join('')}</div></details>

    <details class="fold"><summary>Ещё ${lib.length} идей для вашей отрасли</summary>
      <div class="list">${lib.map((x, k) => `<details class="item"><summary><i>${String(k + 1).padStart(2, '0')}</i><span>${esc(x.title)}<small>${esc(x.area)}</small></span></summary>
        <dl>${x.sample ? `<dt>Пример</dt><dd class="sample">${esc(x.sample)}</dd>` : ''}<dt>Что делает ИИ</dt><dd>${esc(x.flow)}</dd><dt>Как проверить</dt><dd>${esc(x.test)}</dd><dt>Что посчитать</dt><dd>${esc(x.measure)}</dd></dl></details>`).join('')}</div></details>

    <div class="card end"><h3>Разберём ваш случай</h3><p>Принесите один пример — ${esc(wf.unit)} без личных данных. За 20 минут покажем, как это будет работать у вас.</p></div>
  </main>${sticky('Записаться на разбор', 'book')}`;
}
function briefText() {
  const a = state.answers, wf = currentWF(), owner = a.team === 'solo' ? 'собственник' : wf.owner, c = planState.calc, r = calcResult();
  return [`${CONFIG.BRAND} · План пилота`, '', `Проект: ${wf.title}`, `Отрасль: ${QUESTIONS.industry.choices[a.industry]}`, `Отвечает: ${owner}`, '',
    'Что сделать первым', wf.first, '', 'Как это работает', ...wf.steps.map((s, k) => `${k + 1}. ${s.node} — ${s.detail}`), '',
    'Где ИИ может ошибиться', `${wf.exception.record}. ${wf.exception.detail}`, `Как исправить: ${wf.afterRepair.detail}`, '',
    'Как проверить за неделю', '1. Возьмите 5 уже сделанных примеров, включая один неудачный. Запишите время и решения.', `2. Сделайте то же с ИИ. ${wf.inputs}`, `3. Что сравнить: ${wf.measure}`, `Расширяем, если: ${wf.gate}`, `Стоп, если: ${wf.stop}`, '',
    `Экономия: ${c.volume} раз в месяц × (${c.before} − ${c.after} мин) / 60 = ${r.ok ? fmt(r.h) : '—'} ч в месяц`, '',
    'Журнал пилота: пример | минут было | минут стало | нужна правка | кто проверил', '1 |  |  |  |', '2 |  |  |  |', '3 |  |  |  |', '4 |  |  |  |', '5 |  |  |  |', '',
    `Разобрать на звонке: ${CONFIG.BOOK_URL}`].join('\n');
}

/* ---------- Роутинг ---------- */
function route() {
  const r = location.hash.replace(/^#\/?/, '').split('?')[0];
  let html, walk = null;
  if (r === 'guide') { html = viewGuide(); walk = ['walk-' + state.area, WALKS[state.area]]; }
  else if (r === 'quiz') { html = viewQuiz(); }
  else if (r === 'plan') {
    if (!QUIZ.every(k => state.answers[k])) { state.q = 0; return go('quiz'); }
    html = viewPlan(); walk = ['walk-plan', currentWF()];
  } else { html = viewLanding(); walk = ['walk-land', WALKS.sales]; }
  $app.innerHTML = html;
  if (walk) mountWalk(walk[0], walk[1]);
  if (inTG) r ? tg.BackButton.show() : tg.BackButton.hide();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-opt],[data-area],[data-route]'); if (!t) return;
  if (t.dataset.opt) {
    haptic(); state.answers[QUIZ[state.q]] = t.dataset.opt; store('tp_answers', state.answers);
    t.classList.add('on');
    setTimeout(() => {
      state.q++;
      if (state.q >= QUIZ.length && state.contact.name && (state.contact.phone || state.contact.shared)) return finishQuiz();
      route(); window.scrollTo(0, 0);
    }, 180);
    return;
  }
  if (t.dataset.area) { state.area = t.dataset.area; route(); return; }
  if (t.dataset.route) { planState.route = t.dataset.route; const y = scrollY; route(); scrollTo(0, y); send('plan_route', { route: t.dataset.route }); return; }
  const act = t.dataset.act;
  if (act === 'book') { send('book_click', { from: location.hash }); openLink(CONFIG.BOOK_URL); }
  else if (act === 'getGuide') {
    if (!state.contact.shared) {
      const ph = (document.getElementById('gatePhone') || {}).value || '';
      if (!validPhone(ph)) { document.getElementById('gateErr').textContent = 'Проверьте номер телефона.'; document.getElementById('gatePhone').classList.add('bad'); return; }
      state.contact.phone = ph.trim();
    }
    const u = tgUser(); if (u && !state.contact.name) state.contact.name = u.first_name;
    store('tp_contact', state.contact); store('tp_guide', true);
    send('guide_request', { phone: state.contact.phone || '', phone_from_telegram: state.contact.shared ? 'да' : 'нет' });
    go('guide'); scrollTo(0, 0);
  }
  else if (act === 'startQuiz') { state.q = 0; go('quiz'); scrollTo(0, 0); }
  else if (act === 'toGuide') { go('guide'); }
  else if (act === 'qBack') { state.q = Math.max(0, state.q - 1); route(); }
  else if (act === 'shareContact') { tg.requestContact(ok => { if (ok) { state.contact.shared = true; store('tp_contact', state.contact); route(); } }); }
  else if (act === 'finish') {
    const name = (document.getElementById('cName') || {}).value || ''; const err = document.getElementById('cErr');
    if (!name.trim()) { err.textContent = 'Укажите имя.'; return; }
    if (!state.contact.shared) { const ph = document.getElementById('cPhone').value; if (!validPhone(ph)) { err.textContent = 'Проверьте номер телефона.'; return; } state.contact.phone = ph.trim(); }
    state.contact.name = name.trim(); finishQuiz();
  }
  else if (act === 'copyBrief') {
    const done = () => { document.getElementById('briefMsg').textContent = 'Скопировано — вставьте в заметки или перешлите команде.'; send('brief_copy', {}); };
    const txt = briefText();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(done).catch(() => {
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (x) {} ta.remove(); });
  }
});
document.addEventListener('input', e => {
  const k = e.target.dataset && e.target.dataset.calc; if (!k) return;
  planState.calc[k] = e.target.value; const r = calcResult();
  const out = document.querySelector('.calc-out'); if (out) out.innerHTML = r.text;
  const kv = document.getElementById('kvHours'); if (kv) kv.textContent = r.ok && r.h > 0 ? '≈ ' + fmt(r.h) + ' ч/мес' : '—';
});

window.addEventListener('hashchange', route);
if (inTG) {
  tg.ready(); tg.expand();
  try { tg.setHeaderColor('#0D0F14'); tg.setBackgroundColor('#0D0F14'); } catch (e) {}
  tg.BackButton.onClick(() => history.back());
}
/* Повторный вход: если план уже собран — сразу открываем его */
if (!location.hash && store('tp_answers') && QUIZ.every(k => state.answers[k]) && state.contact.phone) location.replace('#/plan');
route();

</script>
</body>
</html>
